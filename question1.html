
<!DOCTYPE html>
<html>
<head>
    <title>Concentric Circles</title>

    <style>
        .container {
            width: 100px;
            height: 100px;
            position: relative;
            margin: 50px;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
        }

        .circle1 {
            width: 60px;
            height: 60px;
            background-color: red;
            top: 20px;
            left: 20px;
        }

        .circle2 {
            width: 40px;
            height: 40px;
            background-color: yellow;
            top: 30px;
            left: 30px;
        }

        .circle3 {
            width: 20px;
            height: 20px;
            background-color: blue;
            top: 40px;
            left: 40px;
        }
    </style>
</head>

<body>
    <h2>Three Concentric Circles</h2>

    <div class="container">
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>
        <div class="circle circle3"></div>
    </div>

</body>
</html>
